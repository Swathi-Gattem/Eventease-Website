<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Card Payment</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card-box {
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .pay-btn {
      background-color: #3f51b5;
      color: white;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .pay-btn:hover {
      background-color: #2c3e91;
    }
  </style>
</head>
<body>

  <div class="card-box">
    <h2>Pay with Card</h2>

    <div class="input-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name">
    </div>

    <div class="input-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email">
    </div>

    <div class="input-group">
      <label for="amount">Amount (₹)</label>
      <input type="number" id="amount" placeholder="Enter amount" value="529">
    </div>

    <button class="pay-btn" onclick="payWithCard()">Pay Now</button>
  </div>

  <script>
    function payWithCard() {
const name = "EventEase";
const email = "EventEase@gmail.com";
      if (amount < 100) {
        alert("Amount should be at least ₹1");
        return;
      }

      const options = {
        "key": "rzp_test_1DP5mmOlF5G5ag", // Replace with your Razorpay key
        "amount": amount,
        "currency": "INR",
        "name": "Asha Fashion",
        "description": "Product Payment",
        "handler": function (response) {
          alert("✅ Payment Successful!\nPayment ID: " + response.razorpay_payment_id);
        },
       prefill: {
    name: "EventEase",
    email: "EventEase@gmail.com",
},
        "theme": {
          "color": "#3f51b5"
        },
        "method": {
          "card": true,
          "netbanking": false,
          "wallet": false,
          "upi": false
        }
      };

      const rzp = new Razorpay(options);
      rzp.open();
    }
  </script>

</body>
</html>
